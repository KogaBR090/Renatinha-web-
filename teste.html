<!DOCTYPE html>
<html lang="jp">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>teste</title>
</head>

<body>
    <main class="container">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
    </main>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body
        {
            height: 200vh;
        }

        .container {
            display: flex;
            padding: 5px;
            border: 1px solid black;
            border-radius: 10px;
            width: 400px;
            height: 400px;
        }

        .box1 {
            top: 0;
            position: sticky;
            border: 1px solid black;
            border-radius: 10px;
            width: 50px;
            height: 50px;
            background-color: blue;
        }

        .box2 {
            position: absolute;
            border: 1px solid black;
            border-radius: 10px;
            width: 50px;
            height: 50px;
            background-color: red;
        }

        .box3 {
            position: fixed;
            bottom: 10px;
            right: 10px;
            cursor: pointer;
            border: 1px solid black;
            border-radius: 10px;
            width: 50px;
            height: 50px;
            background-color: yellow;
            transition: 0.5s ease;
        }

        .box3:hover{
            background-color: rgb(255, 255, 166) ;
        }

    </style>
</body>

</html>
