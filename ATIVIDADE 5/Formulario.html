<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>

<style>
    * {
        margin: 0;
        box-sizing: border-box;
    }

    body {
        padding: 15px;
    }

    .container {
        display: flex;
        justify-content: center;
        height: 690px;
    }

    .container form {
        display: flex;
        flex-direction: column;
        background: #cbcbcb;
        padding: 30px;
        border-radius: 10px;
        width: 100%;
        max-width: 400px;
        height: 120%;
        max-height: 120vh;

    }

    .container form button {
        width: 20%;
        padding: 10px;
        border-radius: 15px;
        border: none;
        background: rgb(132, 132, 132);
        margin: 10px 0 0 0;
        cursor: pointer;
    }

    .container form button:hover {
        transition: 1s cubic-bezier(0.1, 0.6, 0.7, 0.2);
        background: rgb(177, 177, 177);
    }

    .container form input {
        outline: none;
        border: none;
        padding: 10px;
        border-radius: 15px;
    }

    .container form input:focus {
        animation: Piscapisca infinite 10s;
        color: white;
    }

    @keyframes Piscapisca {
        0% {
            background-color: blue;
        }

        50% {
            background-color: red;
        }

        100% {
            background-color: green;
        }
    }

    .container form label {
        margin: 10px 0 5px 30px;
    }

    .container form h1 {
        text-transform: uppercase;
        margin-bottom: 15px;
    }

    .sexo,
    .sexo input,
    .sexo label {
        display: flex;
        margin-top: 10px;
        border: none;
        display: flex;
        align-items: center;
    }

   .container form textarea {
        outline: none;
        border: none;
        padding: 10px;
        border-radius: 15px;
    }

    .container form textarea:focus {
        animation: Piscapisca infinite 10s;
        color: white;
    }
</style>

<body>

    <div class="container">
        <form action="">
            <h1>Login</h1>
            <label for="Nome">Nome:</label>
            <input type="text" name="Nome" required>
            <label for="E-mail">E-mail:</label>
            <input type="email" name="E-mail" required>
            <label for="Senha">Senha:</label>
            <input type="password" name="Senha" required>
            <label for="DataDeNascimento">Data de Nascimento:</label>
            <input type="date" name="DataDeNascimento" required>
            <label for="Curso">Curso:</label>
            <input type="text" name="Curso">
            <fieldset class="sexo">
                <label for="Sexo">Sexo:</label>
                <label for="Sexo">M</label>
                <input type="radio" name="Sexo">
                <label for="Sexo">F</label>
                <input type="radio" name="Sexo">
                <label for="Sexo">Outro</label>
                <input type="radio" name="Sexo">
            </fieldset>
            <label for="Interesses">Interesses:</label>
            <input type="text">
            <label for="Comentario">Comentario:</label>
            <textarea name="Comentario" ></textarea>
            <label for="InputFoto">Upload de Foto:</label>
            <input type="file">


            <button type="submit">Enviar</button>

        </form>
    </div>

</body>

</html>
